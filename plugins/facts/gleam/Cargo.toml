[package]
name = "basalt-plugin-semantic-facts-gleam"
version = "0.1.0"
edition = "2021"
description = "Semantic facts (declarations, calls, imports) for Gleam"

[lib]
crate-type = ["cdylib"]

[dependencies]
# serde feature required: without it serialize_facts is a stub returning empty.
basalt-plugin-sdk = { workspace = true, features = ["serde"] }
