[package]
name = "basalt-plugin-semantic-facts-typescript"
version = "0.2.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
# serde feature required: without it serialize_facts is a stub returning empty.
basalt-plugin-sdk = { workspace = true, features = ["serde"] }

[dependencies.language-core]
path = "../../../crates/language-core"
