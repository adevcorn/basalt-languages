[package]
name = "basalt-plugin-rust-ecs"
version = "0.1.0"
edition = "2021"
description = "Tier-1 Rust ECS inspector plugin for Bevy applications in Basalt"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
basalt-plugin-sdk = { workspace = true, features = ["serde"] }
syn = { version = "2.0", features = ["full", "visit", "extra-traits"] }
proc-macro2 = { version = "1.0", default-features = false, features = ["span-locations"] }
quote = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
