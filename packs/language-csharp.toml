[pack]
name = "language-csharp"
version = "0.1.0"
language = "cs"
capabilities = ["language@cs/v1", "semantic-facts@csharp/v1"]
file_globs = ["**/*.cs"]

[[artifact]]
kind = "parser"
package = "basalt-plugin-parser-csharp"
artifact = "cs.wasm"
parser_filename = "cs"

[[artifact]]
kind = "plugin"
package = "basalt-plugin-semantic-facts-csharp"
artifact = "semantic_facts_csharp.wasm"
install_as = "semantic-facts-csharp"
