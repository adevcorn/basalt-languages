[pack]
name = "language-rust"
version = "0.1.0"
language = "rs"
capabilities = ["language@rs/v1", "semantic-facts@rust/v1"]
file_globs = ["**/*.rs"]

[[artifact]]
kind = "parser"
package = "basalt-plugin-parser-rust"
artifact = "rs.wasm"
parser_filename = "rs"

[[artifact]]
kind = "plugin"
package = "basalt-plugin-semantic-facts-rust"
artifact = "semantic_facts_rust.wasm"
install_as = "semantic-facts-rust"
