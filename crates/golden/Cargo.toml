[package]
name = "golden"
version = "0.1.0"
edition = "2021"
description = "WASM-level golden corpus for Basalt language artifacts"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
wasmtime = { version = "20", default-features = false, features = ["cranelift", "runtime", "gc", "component-model", "cache", "wat"] }
wasmtime-wasi = { version = "20", features = ["preview1"] }
