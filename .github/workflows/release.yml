name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      artifacts: ${{ steps.set.outputs.artifacts }}
    steps:
      - uses: actions/checkout@v4
      - id: set
        run: echo "artifacts=$(python3 scripts/artifacts.py --matrix)" >> "$GITHUB_OUTPUT"

  build:
    needs: matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.matrix.outputs.artifacts) }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1,wasm32-unknown-unknown
      - name: Install wasi-sdk
        if: matrix.kind == 'parser'
        run: |
          wget -q https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-24/wasi-sdk-24.0-x86_64-linux.tar.gz
          tar -xzf wasi-sdk-24.0-x86_64-linux.tar.gz
          echo "WASI_SDK=$PWD/wasi-sdk-24.0-x86_64-linux" >> "$GITHUB_ENV"
      - name: Build ${{ matrix.artifact }}
        run: bash scripts/build-wasm.sh -p ${{ matrix.package }}
      - uses: actions/upload-artifact@v4
        with:
          name: wasm-${{ matrix.package }}
          path: dist/${{ matrix.artifact }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: List release artifacts
        run: ls -lh dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.wasm
