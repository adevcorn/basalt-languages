name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Validate manifests
        run: python3 scripts/validate_manifests.py
      - name: Host tests
        run: cargo test --workspace --exclude golden

  matrix:
    runs-on: ubuntu-latest
    outputs:
      artifacts: ${{ steps.set.outputs.artifacts }}
    steps:
      - uses: actions/checkout@v4
      - id: set
        run: echo "artifacts=$(python3 scripts/artifacts.py --matrix)" >> "$GITHUB_OUTPUT"

  wasm-build:
    needs: matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.matrix.outputs.artifacts) }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1,wasm32-unknown-unknown
      - name: Install wasi-sdk
        if: matrix.kind == 'parser'
        run: |
          wget -q https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-24/wasi-sdk-24.0-x86_64-linux.tar.gz
          tar -xzf wasi-sdk-24.0-x86_64-linux.tar.gz
          echo "WASI_SDK=$PWD/wasi-sdk-24.0-x86_64-linux" >> "$GITHUB_ENV"
      - name: Build ${{ matrix.artifact }}
        run: bash scripts/build-wasm.sh -p ${{ matrix.package }}
      - uses: actions/upload-artifact@v4
        with:
          name: wasm-${{ matrix.package }}
          path: dist/${{ matrix.artifact }}
          if-no-files-found: error

  golden:
    needs: wasm-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/download-artifact@v4
        with:
          pattern: wasm-*
          path: dist
          merge-multiple: true
      - name: Golden corpus
        run: GOLDEN_DIST="$PWD/dist" cargo test -p golden --test corpus -- --nocapture
